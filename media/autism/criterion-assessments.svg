<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"><rect width="880" height="470" fill="#ffffff"/><text x="60" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1f2933">Criterion-referenced assessment</text><text x="60" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#52606d">Measured against a fixed standard, not against the other students</text><rect x="60" y="110" width="350" height="280" rx="10" fill="#f7f9fb" stroke="#dbe2e8" stroke-width="1.6"/><text x="80" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#3d6b8a">Criterion-referenced</text><text x="80" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52606d">each student vs. a fixed standard</text><rect x="93.0" y="286" width="34" height="52" fill="#cfe0ea"/><rect x="143.0" y="242" width="34" height="96" fill="#3d6b8a"/><rect x="193.0" y="254" width="34" height="84" fill="#3d6b8a"/><rect x="243.0" y="300" width="34" height="38" fill="#cfe0ea"/><rect x="293.0" y="228" width="34" height="110" fill="#3d6b8a"/><rect x="343.0" y="272" width="34" height="66" fill="#cfe0ea"/><line x1="78" y1="266" x2="392" y2="266" stroke="#a8402c" stroke-width="2.4" stroke-dasharray="7 5"/><text x="388" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a8402c" text-anchor="end">cut score</text><text x="235.0" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" text-anchor="middle">three students met the standard</text><line x1="78" y1="338" x2="392" y2="338" stroke="#24313d" stroke-width="1.8"/><rect x="470" y="110" width="350" height="280" rx="10" fill="#f7f9fb" stroke="#dbe2e8" stroke-width="1.6"/><text x="490" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#d08c3c">Norm-referenced</text><text x="490" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#52606d">each student vs. the other students</text><rect x="503.0" y="308" width="34" height="30" fill="#e3d5c0"/><rect x="553.0" y="280" width="34" height="58" fill="#e3d5c0"/><rect x="603.0" y="246" width="34" height="92" fill="#e3d5c0"/><rect x="653.0" y="222" width="34" height="116" fill="#a8402c"/><rect x="703.0" y="264" width="34" height="74" fill="#e3d5c0"/><rect x="753.0" y="296" width="34" height="42" fill="#e3d5c0"/><text x="670.0" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a8402c" text-anchor="middle">this student</text><text x="645.0" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d" text-anchor="middle">ranked highest in the class</text><line x1="488" y1="338" x2="802" y2="338" stroke="#24313d" stroke-width="1.8"/><text x="60" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">In a criterion-referenced test, how the other students performed does not change this student’s score.</text></svg>