<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img"><rect width="880" height="420" fill="#ffffff"/><text x="60" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1f2933">Range</text><text x="60" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#52606d">The distance between the lowest and the highest score</text><line x1="90" y1="250" x2="800" y2="250" stroke="#dbe2e8" stroke-width="2" stroke-dasharray="7 6"/><line x1="170" y1="250" x2="720" y2="250" stroke="#3d6b8a" stroke-width="4"/><circle cx="170" cy="250" r="10" fill="#ffffff" stroke="#3d6b8a" stroke-width="4"/><line x1="170" y1="228" x2="170" y2="192" stroke="#52606d" stroke-width="1.6"/><text x="170" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">42</text><text x="170" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" text-anchor="middle">lowest score</text><circle cx="720" cy="250" r="10" fill="#ffffff" stroke="#3d6b8a" stroke-width="4"/><line x1="720" y1="228" x2="720" y2="192" stroke="#52606d" stroke-width="1.6"/><text x="720" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">118</text><text x="720" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" text-anchor="middle">highest score</text><path d="M 170,278 L 170,292 L 720,292 L 720,278" fill="none" stroke="#d08c3c" stroke-width="3"/><line x1="445.0" y1="292" x2="445.0" y2="306" stroke="#d08c3c" stroke-width="3"/><text x="445.0" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#d08c3c" text-anchor="middle">Range = 76</text><text x="60" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">A smaller range generally means the scores cluster tightly, and the result is more likely to reflect reality.</text></svg>