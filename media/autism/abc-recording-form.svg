<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img"><rect width="880" height="560" fill="#ffffff"/><text x="60" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1f2933">A–B–C recording form</text><text x="60" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#52606d">A blank template for recording what happened before, during, and after a behaviour</text><rect x="60" y="104" width="760" height="410" rx="6" fill="#ffffff" stroke="#24313d" stroke-width="1.8"/><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2933">Date</text><line x1="130" y1="142" x2="290" y2="142" stroke="#52606d" stroke-width="1.2"/><text x="300" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2933">Student</text><line x1="370" y1="142" x2="530" y2="142" stroke="#52606d" stroke-width="1.2"/><text x="560" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2933">Behaviour tracked</text><line x1="700" y1="142" x2="780" y2="142" stroke="#52606d" stroke-width="1.2"/><text x="80" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2933">Time started</text><line x1="175" y1="178" x2="325" y2="178" stroke="#52606d" stroke-width="1.2"/><text x="300" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2933">Time ended</text><line x1="395" y1="178" x2="545" y2="178" stroke="#52606d" stroke-width="1.2"/><text x="560" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2933">Observer</text><line x1="640" y1="178" x2="780" y2="178" stroke="#52606d" stroke-width="1.2"/><rect x="80" y="200" width="720" height="62" fill="#eef3f7"/><text x="94.0" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#3d6b8a">A</text><text x="114.0" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">Antecedent</text><text x="94.0" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">What happened right before?</text><text x="334.0" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#3d6b8a">B</text><text x="354.0" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">Behaviour</text><text x="334.0" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">What did the student do or say?</text><text x="574.0" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#3d6b8a">C</text><text x="594.0" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">Consequence</text><text x="574.0" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">What happened right after?</text><line x1="80" y1="262.0" x2="800" y2="262.0" stroke="#dbe2e8" stroke-width="1.3"/><line x1="80" y1="317.0" x2="800" y2="317.0" stroke="#dbe2e8" stroke-width="1.3"/><line x1="80" y1="372.0" x2="800" y2="372.0" stroke="#dbe2e8" stroke-width="1.3"/><line x1="80" y1="427.0" x2="800" y2="427.0" stroke="#dbe2e8" stroke-width="1.3"/><line x1="80" y1="482.0" x2="800" y2="482.0" stroke="#dbe2e8" stroke-width="1.3"/><line x1="80.0" y1="200" x2="80.0" y2="482" stroke="#24313d" stroke-width="1.6"/><line x1="320.0" y1="200" x2="320.0" y2="482" stroke="#dbe2e8" stroke-width="1.3"/><line x1="560.0" y1="200" x2="560.0" y2="482" stroke="#dbe2e8" stroke-width="1.3"/><line x1="800.0" y1="200" x2="800.0" y2="482" stroke="#24313d" stroke-width="1.6"/><rect x="80" y="200" width="720" height="282" fill="none" stroke="#24313d" stroke-width="1.6"/><line x1="80" y1="262" x2="800" y2="262" stroke="#24313d" stroke-width="1.6"/><text x="60" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">Repeated A–B–C records are what a functional behaviour assessment uses to work out why a behaviour keeps happening.</text></svg>