<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img"><rect width="880" height="470" fill="#ffffff"/><text x="60" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1f2933">Standard score</text><text x="60" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#52606d">Raw performance rescaled so every test can be read on the same scale</text><rect x="60" y="98" width="760" height="76" rx="8" fill="#f4f7f9" stroke="#dbe2e8" stroke-width="1.5"/><text x="440" y="146" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#1f2933" text-anchor="middle">z = ( score − mean ) ÷ standard deviation</text><rect x="90.0" y="250" width="16.1" height="46" fill="#e6eef4"/><rect x="106.1" y="250" width="95.2" height="46" fill="#cfe0ea"/><rect x="201.3" y="250" width="477.4" height="46" fill="#7fa8c4"/><rect x="678.7" y="250" width="95.2" height="46" fill="#cfe0ea"/><rect x="773.9" y="250" width="16.1" height="46" fill="#e6eef4"/><text x="153.7" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">70–84</text><text x="440.0" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">85–115</text><text x="726.3" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">116–130</text><rect x="90" y="250" width="700" height="46" fill="none" stroke="#24313d" stroke-width="1.6"/><line x1="106.1" y1="296" x2="106.1" y2="304" stroke="#24313d" stroke-width="1.5"/><text x="106.1" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">70</text><line x1="201.3" y1="296" x2="201.3" y2="304" stroke="#24313d" stroke-width="1.5"/><text x="201.3" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">85</text><line x1="440.0" y1="296" x2="440.0" y2="304" stroke="#24313d" stroke-width="1.5"/><text x="440.0" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">100</text><line x1="678.7" y1="296" x2="678.7" y2="304" stroke="#24313d" stroke-width="1.5"/><text x="678.7" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">115</text><line x1="773.9" y1="296" x2="773.9" y2="304" stroke="#24313d" stroke-width="1.5"/><text x="773.9" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">130</text><line x1="440.0" y1="220" x2="440.0" y2="250" stroke="#a8402c" stroke-width="2.2"/><text x="440.0" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#a8402c" text-anchor="middle">average is set at 100</text><text x="440.0" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" text-anchor="middle">about two-thirds of all students score between 85 and 115</text><text x="60" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#52606d">Scale shown uses a mean of 100 and a standard deviation of 15. Check which scale your report uses — not all tests match.</text></svg>